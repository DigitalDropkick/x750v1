name: Orbit iPhone validation
on:
  push:
    branches: [feature/orbit-companion]
    paths: ['ios/**', '.github/workflows/orbit-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check generated project
        run: |
          python3 ios/generate-project.py
          git diff --exit-code -- ios/Orbit.xcodeproj
      - name: Select available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))
          devices=[d for group in data['devices'].values() for d in group if 'iPhone' in d['name'] and d.get('isAvailable')]
          devices.sort(key=lambda d: (d['name'] != 'iPhone 17 Pro Max', 'Pro Max' not in d['name']))
          assert devices, 'No available iPhone simulator'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('ORBIT_SIMULATOR='+devices[0]['udid']+'\n')
          print('Selected simulator:',devices[0]['name'])
          PY
      - name: Compile and test iPhone app
        run: |
          set -o pipefail
          python3 ios/tests/router-fixture.py > "$RUNNER_TEMP/orbit-fixture.log" 2>&1 &
          ORBIT_FIXTURE_PID=$!
          trap 'kill "$ORBIT_FIXTURE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --insecure https://127.0.0.1:18443/health > /dev/null; then break; fi
            if ! kill -0 "$ORBIT_FIXTURE_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/orbit-fixture.log"
              exit 1
            fi
            sleep 1
          done
          curl --silent --fail --insecure https://127.0.0.1:18443/health > /dev/null
          xcodebuild test -project ios/Orbit.xcodeproj -scheme Orbit -destination "platform=iOS Simulator,id=$ORBIT_SIMULATOR" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 240 -derivedDataPath ios/build -resultBundlePath ios/Orbit-tests.xcresult CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/orbit-build.log"
      - name: Build unsigned iPhone package
        run: |
          set -o pipefail
          xcodebuild build -project ios/Orbit.xcodeproj -scheme Orbit -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/orbit-device-build.log"
          python3 ios/package-unsigned.py ios/build-device/Build/Products/Release-iphoneos/Orbit.app ios/build-device/Orbit-unsigned.ipa
          (cd ios/build-device && shasum -a 256 Orbit-unsigned.ipa > SHA256SUMS)
      - name: Preserve unsigned iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: orbit-unsigned-iphone
          path: |
            ios/build-device/Orbit-unsigned.ipa
            ios/build-device/SHA256SUMS
          retention-days: 30
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d ios/Orbit-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/Orbit-tests.xcresult --output-path ios/build/test-attachments
          fi
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-simulator-evidence
          path: |
            ios/Orbit-tests.xcresult
            ios/build/test-attachments
            ${{ runner.temp }}/orbit-build.log
            ${{ runner.temp }}/orbit-device-build.log
            ${{ runner.temp }}/orbit-fixture.log
          retention-days: 7
      - name: Preserve quick review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-iphone-review
          path: |
            ios/build/test-attachments
            ${{ runner.temp }}/orbit-build.log
            ${{ runner.temp }}/orbit-device-build.log
            ${{ runner.temp }}/orbit-fixture.log
          retention-days: 7
